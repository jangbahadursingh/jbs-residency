<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Registration - JBS Residency</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial, Helvetica, sans-serif;background:#0b1220;color:#e5e7eb}
    .bg{
      position:fixed;inset:0;overflow:hidden;z-index:-1;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(59,130,246,.35), transparent 55%),
                  radial-gradient(1000px 500px at 90% 30%, rgba(16,185,129,.25), transparent 55%),
                  radial-gradient(800px 400px at 50% 90%, rgba(236,72,153,.18), transparent 60%),
                  linear-gradient(180deg,#070c16,#0b1220);
    }
    .blob{
      position:absolute;border-radius:50%;filter:blur(18px);
      animation: floaty 8s ease-in-out infinite;opacity:.85;
    }
    .blob.b1{width:260px;height:260px;left:-60px;top:80px;background:#3b82f6;animation-duration:10s}
    .blob.b2{width:220px;height:220px;right:-50px;top:140px;background:#10b981;animation-duration:12s;animation-delay:-2s}
    .blob.b3{width:180px;height:180px;left:40%;bottom:-60px;background:#ec4899;animation-duration:11s;animation-delay:-4s}
    @keyframes floaty{
      0%,100%{transform:translate3d(0,0,0) scale(1)}
      50%{transform:translate3d(0,-22px,0) scale(1.05)}
    }
    .wrap{max-width:720px;margin:30px auto;padding:28px 18px}
    header{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px}
    .logo{
      width:44px;height:44px;border-radius:12px;
      background:linear-gradient(135deg,#2563eb,#22c55e);
      box-shadow:0 10px 30px rgba(37,99,235,.25);
      display:flex;align-items:center;justify-content:center;font-weight:900
    }
    header h1{margin:0;font-size:18px}
    .card{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;padding:20px;
      box-shadow:0 18px 60px rgba(0,0,0,.25);
      backdrop-filter:blur(8px)
    }
    .card+.card{margin-top:14px}
    h2{margin:0 0 16px;font-size:20px}
    h3{margin:0 0 12px;font-size:15px;color:#93c5fd}
    label{display:block;margin-top:12px;font-size:13px;color:#cbd5e1}
    input,select{
      width:100%;padding:12px;margin-top:6px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:10px;color:#e5e7eb;font-size:14px;
      outline:none;transition:border .2s
    }
    input:focus,select:focus{border-color:#3b82f6}
    input::placeholder{color:#6b7280}
    select option{background:#0b1220;color:#e5e7eb}
    input[type="file"]{padding:8px;color:#9ca3af;font-size:13px}
    input[type="file"]::file-selector-button{
      padding:8px 14px;border-radius:8px;border:0;
      background:rgba(59,130,246,.2);color:#e5e7eb;font-weight:700;cursor:pointer
    }
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:500px){.grid{grid-template-columns:1fr}}
    .btn{
      appearance:none;border:0;cursor:pointer;border-radius:12px;
      font-weight:800;transition:transform .15s ease,filter .15s ease;
      text-decoration:none;display:inline-flex;align-items:center;justify-content:center
    }
    .btn.primary{
      margin-top:18px;width:100%;padding:14px;
      background:linear-gradient(135deg,#22c55e,#3b82f6);
      color:#0b1220;font-size:15px;box-shadow:0 12px 28px rgba(34,197,94,.18)
    }
    .btn.primary:hover{transform:translateY(-2px);filter:saturate(1.1)}
    .err{
      background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);
      border-radius:10px;padding:12px;margin-bottom:14px;color:#fca5a5;font-size:13px
    }
    .hint{font-size:12px;color:#9ca3af;margin-top:12px;text-align:center}
    .hint a{color:#60a5fa;text-decoration:none;font-weight:700}
    .hint a:hover{text-decoration:underline}
    .hint2{font-size:12px;color:#6b7280;margin-top:6px}
    footer{margin-top:26px;padding:18px;text-align:center;color:#9ca3af;font-size:12px}
    footer a{color:#cbd5e1;text-decoration:none;font-weight:700}
    footer a:hover{text-decoration:underline}
    @media (max-width:768px){
      .wrap{margin:20px auto;padding:18px 12px}
      .card{padding:16px}
    }
    @media (max-width:500px){
      .wrap{margin:10px auto;padding:14px 10px}
      .grid{grid-template-columns:1fr;gap:0}
      h2{font-size:18px}
      h3{font-size:14px}
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="wrap">
    <header>
      <div class="logo">JBS</div>
      <h1>JBS Residency</h1>
    </header>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}

    <form method="POST" action="/customer/register" enctype="multipart/form-data">
      <div class="card">
        <h2>Customer Registration</h2>
        <div class="grid">
          <div>
            <label>Select Owner (Residency)</label>
            <select name="owner_id" required>
              <option value="" disabled selected>Select residency</option>
              {% for o in owners %}
                <option value="{{ o.id }}">{{ o.residency_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label>Customer Name</label>
            <input name="name" required placeholder="Full name" />
          </div>
        </div>
        <div class="grid">
          <div>
            <label>Fathername / Husbandname</label>
            <input name="father_name" required placeholder="Father or husband name" />
          </div>
          <div>
            <label>DOB</label>
            <input type="date" name="dob" required />
          </div>
        </div>
        <div class="grid">
          <div>
            <label>Adhar No.</label>
            <input name="aadhar_no" required placeholder="12-digit Aadhaar" />
          </div>
          <div>
            <label>Mobile No.</label>
            <input name="mobile_no" required placeholder="Mobile number" />
          </div>
        </div>
        <label>Address</label>
        <input name="address" required placeholder="Full address" />
        <label>Work / Occupation</label>
        <input name="occupation" required placeholder="Occupation" />
      </div>

      <div class="card">
        <h3>Adhar Photos (Front &amp; Back)</h3>
        <div class="grid">
          <div>
            <label>Adhar Front</label>
            <input type="file" name="aadhar_front" accept="image/*" required />
          </div>
          <div>
            <label>Adhar Back</label>
            <input type="file" name="aadhar_back" accept="image/*" required />
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Profile Photo (Optional)</h3>
        <label>Upload Photo</label>
        <input type="file" name="customer_photo" accept="image/*" />
        <div class="hint2">Optional: Upload a profile photo. You can also add it later from your dashboard.</div>
      </div>

      <div class="card">
        <h3>Room Rent</h3>
        <div class="grid">
          <div>
            <label>Room Rent Type</label>
            <select name="room_rent_type" required>
              <option value="family/1RKB">family/1RKB</option>
              <option value="family/2RKB">family/2RKB</option>
              <option value="family">family</option>
            </select>
          </div>
          <div>
            <label>Room Rent / month</label>
            <select name="room_rent_monthly" required>
              <option value="2000">2000</option>
              <option value="3000">3000</option>
              <option value="4000">4000</option>
              <option value="5000">5000</option>
            </select>
          </div>
        </div>
        <label>Security money</label>
        <input name="security_money" type="number" required placeholder="Security deposit amount" />
      </div>

      <button type="submit" class="btn primary">Register</button>

      <p class="hint">Already registered? <a href="/customer/login">Customer Login</a></p>
    </form>

    <footer>
    <b>JBS Residency</b> &copy; 2026 &middot; <a href="/">Home</a>
    </footer>
  </div>
</body>
</html>
