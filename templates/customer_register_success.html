<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registration Success - JBS Residency</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial, Helvetica, sans-serif;background:#0b1220;color:#e5e7eb}
    .bg{
      position:fixed;inset:0;overflow:hidden;z-index:-1;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(59,130,246,.35), transparent 55%),
                  radial-gradient(1000px 500px at 90% 30%, rgba(16,185,129,.25), transparent 55%),
                  radial-gradient(800px 400px at 50% 90%, rgba(236,72,153,.18), transparent 60%),
                  linear-gradient(180deg,#070c16,#0b1220);
    }
    .blob{
      position:absolute;border-radius:50%;filter:blur(18px);
      animation: floaty 8s ease-in-out infinite;opacity:.85;
    }
    .blob.b1{width:260px;height:260px;left:-60px;top:80px;background:#3b82f6;animation-duration:10s}
    .blob.b2{width:220px;height:220px;right:-50px;top:140px;background:#10b981;animation-duration:12s;animation-delay:-2s}
    .blob.b3{width:180px;height:180px;left:40%;bottom:-60px;background:#ec4899;animation-duration:11s;animation-delay:-4s}
    @keyframes floaty{
      0%,100%{transform:translate3d(0,0,0) scale(1)}
      50%{transform:translate3d(0,-22px,0) scale(1.05)}
    }
    .wrap{max-width:540px;margin:60px auto;padding:28px 18px}
    header{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px}
    .logo{
      width:44px;height:44px;border-radius:12px;
      background:linear-gradient(135deg,#2563eb,#22c55e);
      box-shadow:0 10px 30px rgba(37,99,235,.25);
      display:flex;align-items:center;justify-content:center;font-weight:900
    }
    header h1{margin:0;font-size:18px}
    .card{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;padding:28px;
      box-shadow:0 18px 60px rgba(0,0,0,.25);
      backdrop-filter:blur(8px);text-align:center
    }
    .check{
      width:64px;height:64px;border-radius:50%;
      background:rgba(34,197,94,.15);border:2px solid rgba(34,197,94,.3);
      display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
      font-size:30px
    }
    h2{margin:0 0 8px;font-size:20px}
    .desc{color:#cbd5e1;font-size:14px;margin-bottom:16px}
    .id-box{
      background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);
      border-radius:12px;padding:16px;margin:16px 0
    }
    .id-label{font-size:12px;color:#9ca3af;margin-bottom:6px}
    .id-value{font-size:22px;font-weight:900;color:#60a5fa;word-break:break-all}
    .btn{
      appearance:none;border:0;cursor:pointer;border-radius:12px;
      font-weight:800;transition:transform .15s ease,filter .15s ease;
      text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
      margin-top:18px;width:100%;padding:14px;
      background:linear-gradient(135deg,#22c55e,#3b82f6);
      color:#0b1220;font-size:15px;box-shadow:0 12px 28px rgba(34,197,94,.18)
    }
    .btn:hover{transform:translateY(-2px);filter:saturate(1.1)}
    .hint{font-size:12px;color:#9ca3af;margin-top:14px}
    .hint a{color:#60a5fa;text-decoration:none;font-weight:700}
    .hint a:hover{text-decoration:underline}
    footer{margin-top:26px;padding:18px;text-align:center;color:#9ca3af;font-size:12px}
    footer a{color:#cbd5e1;text-decoration:none;font-weight:700}
    footer a:hover{text-decoration:underline}
    @media (max-width:768px){
      .wrap{margin:30px auto;padding:18px 12px}
      .card{padding:20px}
      .id-value{font-size:18px}
    }
    @media (max-width:400px){
      .wrap{margin:20px auto;padding:14px 8px}
      .check{width:50px;height:50px;font-size:24px}
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="wrap">
    <header>
      <div class="logo">JBS</div>
      <h1>JBS Residency</h1>
    </header>

    <div class="card">
      <div class="check">&check;</div>
      <h2>Registration Completed!</h2>
      <p class="desc">Your customer account has been created successfully.</p>

      <div class="id-box">
        <div class="id-label">Your Customer ID</div>
        <div class="id-value">{{ customer_id }}</div>
      </div>

      <p class="desc" style="font-size:13px">Use this Customer ID + DOB + captcha to login.</p>

      <a href="/customer/login" class="btn">Go to Customer Login</a>
    </div>

    <footer>
    <b>JBS Residency</b> &copy; 2026 &middot; <a href="/">Home</a>
    </footer>
  </div>
</body>
</html>
